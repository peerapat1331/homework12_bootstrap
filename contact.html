<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>

<body>
    <header>

        <div class="content-container">
            <h1>ติดต่อเรา</h1>
            <nav>
                <ul>
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="places.html">สถานที่ท่องเที่ยว</a></li>
                    <li><a href="contact.html">ติดต่อเรา</a></li>
                </ul>
            </nav>
    </header>
    </div>

    <main>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Launch demo modal
          </button>
          
          <!-- Modal -->
          <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <section class="content-container">
                        <h2>ฟอร์มการติดต่อ</h2>
                        <form action="#" method="POST">
                            <!-- ชื่อ-นามสกุล -->
                            <label for="name">ชื่อ-นามสกุล :</label><br>
                            <input type="text" id="name" name="name" required><br><br>
                            <!-- อีเมล -->
                            <label for="email">อีเมล :</label><br>
                            <input type="email" id="email" name="email" required><br><br>
                            <!-- เบอร์โทรศัพท์ -->
                            <label for="phone">เบอร์โทรศัพท์ :</label><br>
                            <input type="tel" id="phone" name="phone"><br><br>
                            <!-- ข้อความ -->
                            <label for="message">ข้อความ :</label><br>
                            <textarea id="message" name="message" rows="5" required></textarea><br><br>
                            <!-- ปุ่มส่งข้อมูล -->
                            <button type="submit">ส่งข้อมูล</button>
                        </form>
                    </section>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-primary">Save changes</button>
                </div>
              </div>
            </div>
          </div>
    </main>
    <footer class="content-container">
        <p>&copy; 2024 เว็บไซต์แนะนำสถานที่ท่องเที่ยวจังหวัดสมุทรปราการ</p>
    </footer>
</body>

</html>
